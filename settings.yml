default:
  project_name: 'Yale Data Viz 04: Skills'
  project_type: project
  tools:
    quarto: true
    renv: false
    quarto_manuscript: false
    quarto_slides: false
    jupyter: false
    targets: false
  author:
    name: Erik
    email: ewestlund@jhu.edu
    affiliation: Johns Hopkins Bloomberg School of Public Health
    url: https://erikwestlund.academic.page
    affiliations:
    - name: Johns Hopkins Bloomberg School of Public Health
      department: Department of Biostatistics
      city: Baltimore
      country: United States
  directories:
    notebooks: notebooks
    scripts: scripts
    functions: functions
    inputs_raw: inputs/raw
    inputs_intermediate: inputs/intermediate
    inputs_final: inputs/final
    docs: docs
    outputs_notebooks: outputs/notebooks
    outputs_tables: outputs/tables
    outputs_figures: outputs/figures
    outputs_models: outputs/models
    outputs_reports: outputs/reports
    cache: outputs/cache
    scratch: scratch
    logs: logs
  extra_directories: ~
  render_dirs:
    notebooks: outputs/notebooks
    docs: outputs/docs
  quarto:
    html:
      format: html
      embed_resources: true
      theme: default
      toc: true
      toc_depth: 3
      code_fold: false
      code_tools: false
      highlight_style: github
    revealjs:
      format: revealjs
      theme: default
      incremental: false
      slide_number: true
      transition: slide
      background_transition: fade
      controls: true
      progress: true
      center: true
      highlight_style: github
    render_dir: outputs/notebooks
  packages:
    use_renv: false
    default_packages:
    - name: dplyr
      source: cran
      auto_attach: true
    - name: ggplot2
      source: cran
      auto_attach: true
    - name: tidyr
      source: cran
      auto_attach: true
    - name: stringr
      source: cran
      auto_attach: true
    - name: readr
      source: cran
      auto_attach: false
    - name: purrr
      source: cran
      auto_attach: true
    - name: tibble
      source: cran
      auto_attach: true
    - name: forcats
      source: cran
      auto_attach: true
    - name: lubridate
      source: cran
      auto_attach: true
    - name: glue
      source: cran
      auto_attach: false
    - name: here
      source: cran
      auto_attach: false
    - name: lme4
      source: cran
      auto_attach: false
    - name: haven
      source: cran
      auto_attach: false
    - name: readxl
      source: cran
      auto_attach: false
    - name: scales
      source: cran
      auto_attach: false
    - name: janitor
      source: cran
      auto_attach: false
    - name: patchwork
      source: cran
      auto_attach: false
  git:
    enabled: true
    user_name: ''
    user_email: ''
    hooks:
      data_security: false
  ai:
    enabled: true
    canonical_file: AGENTS.md
    assistants:
    - claude
    - codex
  scaffold:
    seed_on_scaffold: true
    seed: '123'
    set_theme_on_scaffold: false
    ggplot_theme: theme_minimal
    notebook_format: quarto
    workflow: quarto
    positron: false
    source_all_functions: true
  data: []
  connections:
    default_database: framework
    databases:
      framework:
        driver: sqlite
        database: framework.db
  security:
    sensitive: false
  data_hooks: ~
